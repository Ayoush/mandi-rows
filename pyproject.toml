[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandi-rows"
version = "0.1.0"
description = "Agmarknet mandi price data tools — load, validate, roll up"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mandi = "mandi_rows.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mandi_rows"]

[tool.hatch.build.targets.wheel.force-include]
"data/known_markets.json" = "mandi_rows/data/known_markets.json"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
