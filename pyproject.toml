[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandi-rows"
version = "0.1.0"
description = "Cleaners and checkers for public mandi price CSV snapshots"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mandi = "mandi_rows.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
